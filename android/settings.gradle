// React Native 0.73.x settings
pluginManagement {
  includeBuild("../node_modules/@react-native/gradle-plugin")
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }
}

// Make the RN Gradle plugin available for `apply plugin: "com.facebook.react"`
